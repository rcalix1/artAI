<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ASCII City Prototype</title>

<style>
html, body {
    margin: 0;
    background: #020406;
    overflow: hidden;
}

canvas {
    display: block;
    width: 100vw;
    height: 100vh;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let W, H;

function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
}

window.addEventListener("resize", resize);
resize();


// ============================================================
// WORLD SETTINGS
// ============================================================

const ROAD_WIDTH = 420;
const BLOCK_LENGTH = 500;
const VIEW_DISTANCE = 6000;

let cameraZ = 0;

const camera = {
    x: 0,
    y: 105,
    z: 0,
    focal: 650
};


// ============================================================
// ASCII CHARACTERS
// ============================================================

const shades = [
    "@",
    "#",
    "%",
    "*",
    "+",
    "=",
    "-",
    ":",
    "."
];


// ============================================================
// RANDOM NUMBER FROM POSITION
//
// Gives buildings consistent dimensions instead of changing
// every frame.
// ============================================================

function hash(n) {

    let x = Math.sin(n * 127.1) * 43758.5453;

    return x - Math.floor(x);
}


// ============================================================
// PERSPECTIVE PROJECTION
//
// Converts world coordinates into screen coordinates.
// ============================================================

function project(x, y, z) {

    const dz = z - camera.z;

    if (dz <= 5)
        return null;

    const scale = camera.focal / dz;

    return {
        x: W / 2 + (x - camera.x) * scale,
        y: H / 2 - (y - camera.y) * scale,
        scale: scale,
        depth: dz
    };
}


// ============================================================
// DRAW POLYGON
// ============================================================

function polygon(points, color) {

    if (points.some(p => p === null))
        return;

    ctx.beginPath();

    ctx.moveTo(points[0].x, points[0].y);

    for (let i = 1; i < points.length; i++)
        ctx.lineTo(points[i].x, points[i].y);

    ctx.closePath();

    ctx.fillStyle = color;
    ctx.fill();
}


// ============================================================
// ROAD
// ============================================================

function drawRoad() {

    const nearZ = camera.z + 20;
    const farZ  = camera.z + VIEW_DISTANCE;

    const road = [

        project(-ROAD_WIDTH/2, 0, nearZ),
        project( ROAD_WIDTH/2, 0, nearZ),
        project( ROAD_WIDTH/2, 0, farZ),
        project(-ROAD_WIDTH/2, 0, farZ)

    ];

    polygon(road, "#080c0e");


    // sidewalks

    drawGroundStrip(
        -ROAD_WIDTH/2 - 70,
        -ROAD_WIDTH/2,
        "#111719"
    );

    drawGroundStrip(
        ROAD_WIDTH/2,
        ROAD_WIDTH/2 + 70,
        "#111719"
    );


    // center lane markings

    for (let z = 0; z < VIEW_DISTANCE; z += 180) {

        let worldZ =
            Math.floor(camera.z / 180) * 180 + z;

        drawLaneMark(worldZ);

    }
}


// ============================================================
// GROUND STRIP
// ============================================================

function drawGroundStrip(x1, x2, color) {

    const nearZ = camera.z + 20;
    const farZ  = camera.z + VIEW_DISTANCE;

    polygon([

        project(x1, 0, nearZ),
        project(x2, 0, nearZ),
        project(x2, 0, farZ),
        project(x1, 0, farZ)

    ], color);
}


// ============================================================
// ROAD DASH
// ============================================================

function drawLaneMark(z) {

    let z2 = z + 80;

    polygon([

        project(-5, 1, z),
        project( 5, 1, z),
        project( 5, 1, z2),
        project(-5, 1, z2)

    ], "#586466");
}


// ============================================================
// BUILDING
// ============================================================

function drawBuilding(x, z, width, height, depth, seed) {

    let frontZ = z;
    let backZ  = z + depth;

    let x1 = x - width/2;
    let x2 = x + width/2;

    const A = project(x1, 0, frontZ);
    const B = project(x2, 0, frontZ);
    const C = project(x2, height, frontZ);
    const D = project(x1, height, frontZ);

    const E = project(x1, 0, backZ);
    const F = project(x2, 0, backZ);
    const G = project(x2, height, backZ);
    const Hh = project(x1, height, backZ);

    if (!A || !B || !C || !D)
        return;


    // front face

    polygon(
        [A,B,C,D],
        "#10181a"
    );


    // side face

    if (x < 0)

        polygon(
            [B,F,G,C],
            "#091012"
        );

    else

        polygon(
            [A,E,Hh,D],
            "#091012"
        );


    // roof

    polygon(
        [D,C,G,Hh],
        "#172326"
    );


    drawWindows(
        x,
        frontZ - 1,
        width,
        height,
        seed
    );
}


// ============================================================
// WINDOWS
// ============================================================

function drawWindows(x, z, width, height, seed) {

    const columns =
        Math.max(2, Math.floor(width / 35));

    const floors =
        Math.max(2, Math.floor(height / 35));

    for (let floor = 1; floor < floors; floor++) {

        for (let col = 0; col < columns; col++) {

            let r = hash(seed + floor * 13 + col * 7);

            if (r < .42)
                continue;

            let wx =
                x - width/2 +
                (col + .5) * width/columns;

            let wy =
                floor * height/floors;

            let p = project(wx, wy, z);

            if (!p)
                continue;

            let size =
                Math.max(1, 7 * p.scale);

            ctx.fillStyle =
                r > .82
                ? "#b8d9c8"
                : "#516b65";

            ctx.fillRect(
                p.x - size/2,
                p.y - size/2,
                size,
                size
            );
        }
    }
}


// ============================================================
// PERSON
// ============================================================

function drawPerson(x, z, phase) {

    let bob =
        Math.sin(phase) * 2;

    let feet =
        project(x, 0, z);

    let head =
        project(x, 24 + bob, z);

    if (!feet || !head)
        return;

    let size =
        Math.max(2, 10 * feet.scale);


    ctx.strokeStyle = "#819995";
    ctx.lineWidth =
        Math.max(1, 2 * feet.scale);


    // body

    ctx.beginPath();

    ctx.moveTo(head.x, head.y);
    ctx.lineTo(feet.x, feet.y);

    ctx.stroke();


    // head

    ctx.beginPath();

    ctx.arc(
        head.x,
        head.y - size,
        size * .45,
        0,
        Math.PI * 2
    );

    ctx.fillStyle = "#a5b8b2";
    ctx.fill();
}


// ============================================================
// STREET LIGHT
// ============================================================

function drawStreetLight(x, z) {

    let bottom =
        project(x, 0, z);

    let top =
        project(x, 85, z);

    if (!bottom || !top)
        return;

    ctx.strokeStyle = "#354442";

    ctx.lineWidth =
        Math.max(1, 3 * bottom.scale);

    ctx.beginPath();

    ctx.moveTo(bottom.x, bottom.y);
    ctx.lineTo(top.x, top.y);

    ctx.stroke();


    let radius =
        Math.max(1, 7 * top.scale);

    ctx.fillStyle = "#a8c7bb";

    ctx.beginPath();

    ctx.arc(
        top.x,
        top.y,
        radius,
        0,
        Math.PI * 2
    );

    ctx.fill();
}


// ============================================================
// ASCII ATMOSPHERE
//
// This is intentionally light right now.
//
// Later this can become the REAL rendering layer where
// brightness/depth/material determines character.
// ============================================================

function drawASCII() {

    ctx.font = "11px monospace";
    ctx.fillStyle = "#18312d";

    const spacing = 18;

    for (let y = 0; y < H; y += spacing) {

        for (let x = 0; x < W; x += spacing) {

            let distanceFromCenter =
                Math.abs(x - W/2) / W;

            let index =
                Math.floor(
                    distanceFromCenter *
                    shades.length
                );

            index =
                Math.min(
                    shades.length - 1,
                    index
                );

            if (Math.random() < .035)

                ctx.fillText(
                    shades[index],
                    x,
                    y
                );
        }
    }
}


// ============================================================
// CITY GENERATION
// ============================================================

function drawCity() {

    const startBlock =
        Math.floor(camera.z / BLOCK_LENGTH) - 1;

    const blocks =
        Math.ceil(
            VIEW_DISTANCE / BLOCK_LENGTH
        ) + 3;


    // painter's algorithm:
    // draw distant objects first

    for (
        let i = startBlock + blocks;
        i >= startBlock;
        i--
    ) {

        let z =
            i * BLOCK_LENGTH;

        if (z < camera.z + 10)
            continue;


        // LEFT BUILDING

        let seedL = i * 17;

        let widthL =
            170 + hash(seedL) * 170;

        let heightL =
            180 + hash(seedL + 1) * 500;

        let depthL =
            250 + hash(seedL + 2) * 180;

        drawBuilding(

            -ROAD_WIDTH/2
            - 100
            - widthL/2,

            z,

            widthL,
            heightL,
            depthL,
            seedL
        );


        // RIGHT BUILDING

        let seedR = i * 31;

        let widthR =
            170 + hash(seedR) * 170;

        let heightR =
            180 + hash(seedR + 1) * 500;

        let depthR =
            250 + hash(seedR + 2) * 180;

        drawBuilding(

            ROAD_WIDTH/2
            + 100
            + widthR/2,

            z + 70,

            widthR,
            heightR,
            depthR,
            seedR
        );


        // STREET LIGHTS

        drawStreetLight(
            -ROAD_WIDTH/2 - 35,
            z + 100
        );

        drawStreetLight(
            ROAD_WIDTH/2 + 35,
            z + 100
        );


        // PEOPLE

        if (i % 2 === 0) {

            drawPerson(
                -ROAD_WIDTH/2 - 40,
                z + 180,
                performance.now()/300 + i
            );

        }

        if (i % 3 === 0) {

            drawPerson(
                ROAD_WIDTH/2 + 40,
                z + 260,
                performance.now()/350 + i
            );

        }
    }
}


// ============================================================
// SKY
// ============================================================

function drawSky() {

    ctx.fillStyle = "#020506";

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    // horizon haze

    let gradient =
        ctx.createLinearGradient(
            0,
            H*.25,
            0,
            H*.65
        );

    gradient.addColorStop(
        0,
        "#020506"
    );

    gradient.addColorStop(
        1,
        "#0d1919"
    );

    ctx.fillStyle = gradient;

    ctx.fillRect(
        0,
        H*.25,
        W,
        H*.4
    );
}


// ============================================================
// ANIMATION
// ============================================================

let lastTime = performance.now();

function animate(time) {

    let dt =
        (time - lastTime) / 1000;

    lastTime = time;


    // --------------------------------------------
    // MOVE CAMERA
    // --------------------------------------------

    camera.z += 140 * dt;


    // tiny human-like sideways movement

    camera.x =
        Math.sin(time * .00025) * 15;


    // tiny vertical walking motion

    camera.y =
        105 +
        Math.sin(time * .004) * 2;


    // --------------------------------------------
    // LOOP CITY
    //
    // Numbers stay manageable indefinitely.
    // --------------------------------------------

    if (camera.z > 100000)
        camera.z -= 100000;


    drawSky();

    drawRoad();

    drawCity();

    drawASCII();


    // HUD

    ctx.font = "14px monospace";

    ctx.fillStyle = "#78958d";

    ctx.fillText(
        "ASCII CITY // WALK MODE",
        20,
        30
    );

    ctx.fillText(
        "Z: " +
        Math.floor(camera.z),
        20,
        50
    );


    requestAnimationFrame(animate);
}

requestAnimationFrame(animate);

</script>

</body>
</html>
